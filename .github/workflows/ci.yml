# CI — machine-enforces the green gate (constitution Article 3 §3: `main` is
# updated only via a green PR). Runs the same suite as the root `npm test`
# (backend pytest + frontend vitest, plus a tsc typecheck) on every PR and on
# every push to main. See docs/git_strategy.md § CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Supply chain. Security is the project's stated #1 priority, and until
  # 2026-07-19 nothing checked our dependencies at all — the first run found 5
  # advisories in the frontend toolchain, one of them critical. Runs on PRs and
  # on main, because a new advisory can land against code that has not changed:
  # this needs to fail on the world's schedule, not only on ours.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Audit Python dependencies (pip-audit)
        working-directory: backend
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Audit npm dependencies
        working-directory: app
        # BLOCKS on high/critical in code that SHIPS TO A BROWSER (--omit=dev).
        # Everything else is printed and does not block.
        #
        # `--omit=dev` was added 2026-07-25, and it is a real narrowing of the
        # gate, so here is the reasoning rather than just the flag:
        #
        # The 5 high advisories that were failing this job on main are all one
        # chain — brace-expansion -> minimatch@3 -> eslint internals. They are
        # not fixable. eslint@9 depends on minimatch@^3.1.2, which needs
        # brace-expansion@^1.1.7, and the latest 1.x IS the vulnerable version;
        # no patched 1.x exists. Overrides get 5 highs down to 4 (see
        # app/package.json "comment:overrides" for the two that BREAK the
        # linter, tested, not guessed). The only true fix is eslint 10 — a
        # major bump, deliberately deferred.
        #
        # That left three options: bump eslint 10 now, leave this job red on
        # every PR, or scope the blocking gate to what actually reaches a user.
        # A permanently-red check is the worst of the three: it trains everyone
        # to ignore the one job that would flag a real supply-chain problem.
        # A DoS in the lint toolchain's glob matcher is exploitable only by
        # someone who already controls the source or CI inputs; a vulnerability
        # in a shipped dependency is exploitable by anyone with a browser.
        #
        # The trade-off this accepts: a genuinely dangerous DEV dependency now
        # only prints. So read the second command's output at each dependency
        # bump — it is informational, not decorative.
        run: |
          npm audit --audit-level=high --omit=dev
          npm audit || true

  # Accessibility and layout invariants in a real browser. Without this the
  # Playwright suite only runs when someone remembers, and an unrun test rots.
  #
  # No pixel baselines, deliberately: this project is developed on Windows and
  # runs CI on Linux, where font antialiasing alone changes the render, and the
  # usual fix (a Playwright Docker image) is ruled out by "no Docker required".
  # Baselines would be Linux PNGs nobody can regenerate locally, or a constant
  # source of false diffs. The layout spec asserts the properties those pixels
  # would have protected instead — each one a defect this project actually
  # shipped and a human had to catch by eye.
  e2e:
    name: Browser (a11y + layout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run a11y + layout specs
        # The screens spec only writes artefacts, so it is skipped here — its
        # value is being looked at, which CI cannot do.
        run: npx playwright test e2e/a11y.spec.ts e2e/layout.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # The golden path (M13, spec 013): one business from listed to sold, in a real
  # browser, against a REAL FastAPI on a database deleted before the run. This is
  # the only job in this file that exercises the two halves together — every
  # other one tests the frontend against stubs or the backend against a
  # TestClient, and neither can catch a break in the seam between them.
  #
  # It blocks, and it runs on every PR. The sibling browser job already records
  # why ("without this the Playwright suite only runs when someone remembers, and
  # an unrun test rots"), and it applies double here: a golden path that is
  # advisory is a green light wired to nothing. Criterion H5 pins both properties
  # so nobody can later soften this into a warning.
  #
  # Needs BOTH toolchains: Python for the API and for the admin-promotion CLI
  # that global setup calls, Node for the built bundle the browser drives.
  golden-path:
    name: Golden path (E2E, real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run the golden path
        working-directory: app
        # The config starts both servers itself and points the API at a
        # throwaway e2e.db, so there is nothing to arrange here.
        run: npx playwright test --config=playwright.golden.config.ts
      - uses: actions/upload-artifact@v4
        # Step-level, and deliberately not a job-level condition: it decides
        # whether to keep an artefact, never whether the suite runs. A red run on
        # someone else's PR should be diagnosable without reproducing it.
        if: failure()
        with:
          name: playwright-report-golden
          path: app/playwright-report/
          retention-days: 7

  # The constitution's central rule (Article 3 §2) — every GIVEN/WHEN/THEN
  # criterion becomes exactly one test — made mechanical. A dropped criterion
  # is the one failure a test suite structurally cannot catch by itself: the
  # missing test is invisible to the tests that exist, so everything stays
  # green while the milestone quietly does less than it promised.
  spec-coverage:
    name: Spec coverage (criteria cited by tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every acceptance criterion is cited by a test
        run: python scripts/check_spec_coverage.py

  # Bound to the merge, not to the milestone-close ceremony. `main` contains
  # only merged work, so nothing on it may still claim to be in flight — the
  # check enforces exactly that. It runs on push to main (the one step no
  # change can route around) and is a no-op on PRs, where in-flight language
  # is correct. See scripts/check_status_freshness.py for the two prior
  # failures that motivated it.
  status-freshness:
    name: Status freshness (main only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the status surfaces match reality
        run: python scripts/check_status_freshness.py

  # The owner's PR conventions: no agent attribution anywhere, and a body that
  # leads with "What was shipped" and carries no review narrative. There is an
  # agent hook that blocks these before the command runs, but hooks live in
  # agent settings and git hooks live in .git/ — neither survives a fresh clone
  # or a human committing by hand. This is the backstop that cannot be routed
  # around. PR-only: it needs the PR body from the event payload, and the
  # commit range is meaningless on a push to main.
  pr-conventions:
    name: PR conventions (no attribution)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the commit range needs full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The guards' own tests run first: they block commits and PRs, so a false
      # positive is a wall, not a nuisance. The "documents the rule" cases exist
      # because the first version of this check failed on its own PR.
      - name: Test the guards
        run: python scripts/test_pr_conventions.py
      - name: Check commits and the PR body
        run: python scripts/check_pr_conventions.py --base ${{ github.base_ref }}
      # A different guard, same reasoning: a squash-merge with no --body lets
      # GitHub default to concatenating every branch commit onto main (M5,
      # PR #38). Tested here — on every PR — for the same "false positive is a
      # wall" reason; the actual merge-commit check is push-only, below.
      - name: Test the squash-merge guard
        run: python scripts/test_squash_merge_guard.py

  # The squash-merge counterpart to status-freshness above: bound to the merge,
  # not to a command anyone could skip. `.claude/hooks/guard_squash_merge.py`
  # blocks the mistake before the merge command runs; this catches whatever
  # reaches `main` another way (a browser merge, a different machine, a hook
  # that never fired) — exactly the M5 / PR #38 failure, after the fact.
  merge-commit-shape:
    name: Merge commit shape (main only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the squash-merge commit landed short
        run: python scripts/check_last_main_commit.py

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Run vitest
        run: npm test
